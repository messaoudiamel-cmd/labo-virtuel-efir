    <style>
        /* Animations personnalisées */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
        }
        .glow-tp {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.8);
        }
    </style>

<body class="bg-gradient-to-br from-[#0B132B] to-[#1C2541] text-white min-h-screen flex flex-col font-sans relative overflow-hidden">

    <!-- Décor : Ions en arrière-plan (Opacité très réduite) -->
    <div class="absolute inset-0 pointer-events-none opacity-10 text-2xl font-bold flex justify-between p-10">
        <span class="absolute top-10 left-10">Cu²⁺</span>
        <span class="absolute top-40 right-20">Na⁺</span>
        <span class="absolute bottom-20 left-1/4">Fe³⁺</span>
        <span class="absolute top-1/2 right-10">Ag⁺</span>
    </div>

    <!-- BARRE DE NAVIGATION (Titre et Logo) -->
    <header class="w-full p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-4">
            <!-- Remplacer par votre vrai logo -->
            <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center text-blue-900 font-bold text-xl">M</div>
            <h1 class="text-2xl font-bold tracking-wide">Ma Science <span class="text-cyan-400">Physique-Chimie</span></h1>
        </div>
        <div class="text-sm text-gray-400">Plateforme pédagogique interactive</div>
    </header>

    <!-- CONTENU PRINCIPAL (Centré) -->
    <main class="flex-grow flex flex-col items-center justify-center relative z-10 w-full max-w-6xl mx-auto px-4 mt-8">

        <!-- Les Boutons Orbitaux (Disposition en grille absolue pour simuler l'orbite) -->
        <div class="relative w-full max-w-3xl h-[500px] flex justify-center items-center">

            <!-- Bouton Cours (En haut à gauche) -->
            <button class="glass-panel absolute top-10 left-0 w-32 h-32 rounded-full flex flex-col items-center justify-center gap-2 group">
                <span class="text-3xl group-hover:scale-110 transition-transform">📘</span>
                <span class="text-sm font-medium">Cours</span>
            </button>

            <!-- Bouton QCM (En haut à droite) -->
            <button class="glass-panel absolute top-10 right-0 w-32 h-32 rounded-full flex flex-col items-center justify-center gap-2 group">
                <span class="text-3xl group-hover:scale-110 transition-transform">✅</span>
                <span class="text-sm font-medium">QCM</span>
            </button>

            <!-- L'ILLUSTRATION CENTRALE (Les tubes) -->
            <div class="relative z-20 flex gap-4 items-end animate-float">
                <!-- Tubes simplifiés pour l'exemple -->
                <div class="w-12 h-48 border-2 border-gray-400 rounded-b-full relative overflow-hidden bg-opacity-20 bg-blue-500">
                    <div class="absolute bottom-0 w-full h-1/2 bg-blue-400"></div>
                </div>
                <div class="w-12 h-56 border-2 border-gray-400 rounded-b-full relative overflow-hidden bg-opacity-20 bg-yellow-500">
                    <div class="absolute bottom-0 w-full h-1/3 bg-yellow-600"></div>
                </div>
                <div class="w-12 h-64 border-2 border-gray-400 rounded-b-full relative overflow-hidden bg-opacity-20 bg-green-500">
                    <div class="absolute bottom-0 w-full h-1/2 bg-green-500"></div>
                </div>
                <div class="w-12 h-48 border-2 border-gray-400 rounded-b-full relative overflow-hidden bg-opacity-20 bg-gray-500">
                    <div class="absolute bottom-0 w-full h-1/4 bg-gray-600"></div>
                </div>
            </div>

            <!-- Bouton TP (Au centre, légèrement devant) -->
            <button class="absolute z-30 bottom-20 glass-panel glow-tp w-40 h-40 rounded-full flex flex-col items-center justify-center gap-2 group bg-blue-900/40">
                <span class="text-4xl group-hover:rotate-12 transition-transform">🧪</span>
                <span class="text-base font-bold text-cyan-300">TP / Labo</span>
            </button>

            <!-- Bouton Outils (En bas à gauche) -->
            <button class="glass-panel absolute bottom-10 left-10 w-28 h-28 rounded-full flex flex-col items-center justify-center gap-2 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🛠️</span>
                <span class="text-xs font-medium text-center leading-tight">Outils &amp;<br>Méthodes</span>
            </button>

            <!-- Bouton Évaluation (En bas à droite) -->
            <button class="glass-panel absolute bottom-10 right-10 w-28 h-28 rounded-full flex flex-col items-center justify-center gap-2 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">📝</span>
                <span class="text-xs font-medium text-center leading-tight">Évaluation</span>
            </button>

        </div>
    </main>

    <!-- PIED DE PAGE (Signature discrète) -->
    <footer class="w-full p-6 text-center z-10 border-t border-gray-700/50 mt-10">
        <div class="flex items-center justify-center gap-3 text-sm text-gray-400">
            <span class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center">👩‍🏫</span>
            <p>Conçue avec passion par <strong class="text-white">Mme Messaoudi</strong>, Professeure de Physique-Chimie</p>
        </div>
        <p class="text-xs text-gray-600 mt-2">© 2024 - Ma Science Physique-Chimie</p>
    </footer>

</body>
</html>
